<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lineage</title><meta name="description" content="Lineage: a 3D evolution game from single cell to galactic core. Mould your creature, for one or two players on one keyboard."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#0b0916">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one WebGL canvas split into two side-by-side viewports; each player owns a HUD pane over their half
   (card top-left, prompt and action keys bottom, key-driven menu docked right). Shared modal for title and stage reports.
   Deliberately single-theme: the game world is dark. */
:root{
  --abyss:#0b0916; --ink:#141026; --panel:rgba(20,16,38,.86); --panel-solid:#19142f; --raise:#241d43;
  --line:#3a3160; --line-soft:rgba(170,150,230,.16);
  --text:#efe9f7; --muted:#a79ec4; --dim:#706890;
  --membrane:#ff7a59; --bio:#5ce1e6; --chloro:#a6d96a; --ochre:#f2b544; --danger:#ff4d6d; --violet:#b48cff;
  --p1:#5ce1e6; --p2:#ff9f5a;
  --f-display:"Syne","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--abyss);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#divider{position:absolute;top:0;bottom:0;left:50%;width:3px;transform:translateX(-50%);background:linear-gradient(var(--p1),var(--p2));opacity:.7;z-index:4}

.pane{position:absolute;top:0;bottom:0;pointer-events:none;z-index:5;overflow:hidden}
.pane.solo{left:0;right:0}
.pane.left{left:0;right:50%}
.pane.right{left:50%;right:0}
.pane>*{pointer-events:auto}
.card{position:absolute;top:12px;left:max(14px,env(safe-area-inset-left,0px));width:min(250px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 11px;backdrop-filter:blur(6px)}
.card:empty{display:none}
.pane.right .card{left:auto;right:14px}
.who{display:flex;align-items:center;gap:6px;font:600 10px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.who i{width:9px;height:9px;border-radius:2px;display:inline-block}
.title{font:800 19px/1.1 var(--f-display);margin:3px 0 4px;overflow-wrap:anywhere}
.meter{margin-top:6px}
.mlabel{display:flex;justify-content:space-between;gap:8px;font:500 11px/1.3 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .25s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin:8px 0 0}
.stats div{display:flex;justify-content:space-between;gap:6px;min-width:0}
.stats dt{font:500 11px/1.4 var(--f-mono);color:var(--muted)}
.stats dd{margin:0;font:600 12px/1.4 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bottom{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.acts{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;width:max-content;max-width:calc(100% - 20px)}
.act{font:600 12px/1 var(--f-body);color:var(--text);background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:0 8px;min-height:32px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;cursor:pointer}
.act kbd{font:600 10px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 5px;min-width:18px;text-align:center}
.act.off{opacity:.35}
.act.hot{border-color:var(--ochre);box-shadow:inset 0 0 0 1px var(--ochre)}
.prompt:empty{display:none}
.prompt{max-width:calc(100% - 24px);text-align:center;font:600 13px/1.35 var(--f-body);color:var(--text);text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none}
.ptoasts{position:absolute;top:200px;left:14px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;width:min(300px,calc(100% - 28px));pointer-events:none}
.pane.right .ptoasts{left:auto;right:14px;align-items:flex-end}
.pane.solo .ptoasts{top:60px;left:auto;right:14px;align-items:flex-end}
.pane.left .pmenu{right:auto;left:12px}
.pane.menuopen .card{visibility:hidden}
.toast{background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font:500 12.5px/1.4 var(--f-body);animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.good{border-color:rgba(166,217,106,.6)} .toast.bad{border-color:rgba(255,77,109,.65)} .toast.warn{border-color:rgba(242,181,68,.65)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font:600 11px/1.25 var(--f-mono);color:var(--text);text-shadow:0 1px 2px #000,0 0 6px #000;white-space:nowrap;text-align:center}
.lbl small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.lbl.sel{color:var(--ochre)}
.radar{position:absolute;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid var(--danger);transform-origin:50% 60%}

.pmenu{position:absolute;right:12px;top:12px;bottom:60px;width:min(330px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;backdrop-filter:blur(8px)}
.pmenu h3{font:800 18px/1.1 var(--f-display);margin:2px 0 4px}
.pmenu .sub{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:8px}
.pmenu .list{overflow:auto;display:grid;gap:3px;padding-right:2px;min-height:0}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 9px;border-radius:7px;border:1px solid transparent;cursor:pointer}
.mi .l{font-weight:700;font-size:13px}
.mi .d{grid-column:1/-1;font-size:11.5px;color:var(--muted);line-height:1.35}
.mi .v{font:600 12px var(--f-mono);color:var(--ochre);white-space:nowrap}
.mi.cur{background:var(--raise);border-color:var(--ochre)}
.mi.dis{opacity:.4}
.mi.head{cursor:default;padding:8px 9px 2px;font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pmenu .keys{margin-top:8px;font:500 11px/1.4 var(--f-mono);color:var(--muted)}
.wait{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;text-align:center;max-width:calc(100% - 30px)}
.wait b{display:block;font:800 18px var(--f-display);margin-bottom:4px}
.wait span{color:var(--muted);font-size:12.5px}

.tools{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:7}
.tools.solo{left:auto;right:max(14px,env(safe-area-inset-right,0px));transform:none}
.icon-btn{font:600 11px var(--f-mono);color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;height:32px;padding:0 10px;cursor:pointer}
.icon-btn:hover{border-color:var(--ochre)}
#stagebar{position:absolute;top:50px;left:50%;transform:translateX(-50%);z-index:7;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
#stagebar span{font:600 9px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:5px 7px;border-radius:999px}
#stagebar span.done{color:var(--chloro)} #stagebar span.on{color:#1b1306;background:var(--ochre)}
#accord{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);z-index:7;font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
#accord.on{color:#13230a;background:var(--chloro);border-color:var(--chloro)}

#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,4,14,.62);z-index:10;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));backdrop-filter:blur(3px)}
.sheet{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h2{font:800 28px/1.05 var(--f-display);margin:4px 0 10px;text-wrap:balance}
.sheet p{color:var(--muted);line-height:1.55;max-width:66ch;margin:8px 0}
.eyebrow{font:600 10px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{font:600 13px/1 var(--f-body);color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:0 14px;min-height:40px;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.btn:hover{border-color:var(--ochre)} .btn:focus-visible,.icon-btn:focus-visible,.mi:focus-visible{outline:2px solid var(--bio);outline-offset:2px}
.btn.primary{background:var(--ochre);color:#1b1306;border-color:var(--ochre)}
.btn kbd{font:600 10px var(--f-mono);border:1px solid currentColor;border-radius:4px;padding:2px 5px;opacity:.7}
.wordmark{font:800 clamp(48px,9vw,96px)/.9 var(--f-display);letter-spacing:-.02em;margin:6px 0 4px}
.wordmark em{font-style:normal;color:var(--ochre)}
.seg{display:inline-flex;gap:4px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{font:700 13px var(--f-body);color:var(--muted);background:none;border:0;border-radius:7px;padding:9px 14px;cursor:pointer}
.seg button.on{background:var(--ochre);color:#1b1306}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pcard{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.pcard h4{margin:0;font:800 16px var(--f-display);display:flex;align-items:center;gap:8px}
.pcard h4 i{width:12px;height:12px;border-radius:3px}
.field{display:grid;gap:5px}
.field label{font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input[type=text]{font:600 15px var(--f-body);color:var(--text);background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.field input[type=range]{width:100%;accent-color:var(--ochre)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font:500 12px/1.5 var(--f-body);color:var(--muted)}
.keys kbd{font:600 11px var(--f-mono);color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:1px 6px;justify-self:start}
.promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.promise div{background:var(--ink);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.promise b{display:block;color:var(--text);font:700 13px var(--f-body);margin-bottom:3px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.legacy{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.legacy .t{font:800 18px/1.1 var(--f-display);margin:4px 0}
.legacy .d{color:var(--muted);font-size:12.5px;line-height:1.45}
.mods{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mods span{font:600 10.5px var(--f-mono);background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
.ready{font:600 12px var(--f-mono);color:var(--muted)} .ready b{color:var(--chloro)}
details{margin-top:10px;color:var(--muted)} summary{cursor:pointer;font:600 12px var(--f-mono)}
#loading{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:var(--abyss);font:600 13px var(--f-mono);color:var(--muted)}

/* ability bar */
.ab{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:62px}
.ab .ring{position:relative;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3b3170,#1a1534);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.ab svg{width:24px;height:24px;fill:var(--text)}
.ab .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ab .lv{position:absolute;right:2px;bottom:1px;font:700 10px var(--f-mono);color:#1b1306;background:var(--ochre);border-radius:6px;padding:0 4px;line-height:14px}
.ab span{font:600 10.5px/1 var(--f-body);color:var(--text);text-transform:capitalize;text-shadow:0 1px 2px #000}
.ab kbd{font:600 9.5px/1 var(--f-mono);color:var(--muted);background:rgba(10,8,20,.7);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.ab.off{opacity:.38}
.ab.hot .ring{border-color:var(--ochre);box-shadow:0 0 0 3px rgba(242,181,68,.35),0 3px 10px rgba(0,0,0,.4)}
.relbar{width:90px;height:5px;margin:3px auto 0;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.relbar{position:relative}
.relbar i.rival{position:absolute;left:0;top:0;background:var(--danger);opacity:.55;height:2px}
#race{position:absolute;top:94px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:14px;background:rgba(10,8,22,.72);padding:5px 12px;border-radius:20px;font:600 11px/1 system-ui;color:#eee;pointer-events:none}
#race .rc{display:flex;align-items:center;gap:6px}#race .rc>i{width:8px;height:8px;border-radius:50%}
#race .rb{width:90px;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}#race .rb b{display:block;height:100%}
#app.editing #race{display:none}
#race em{font-style:normal;opacity:.8;min-width:28px}
.edge{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--c);font:700 11px/1 system-ui;text-shadow:0 1px 3px #000;white-space:nowrap}
.edge i{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--c)}
.warn-ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ff3b3b;color:#fff;font:900 18px/1 system-ui;box-shadow:0 0 14px #ff3b3b;animation:wpulse .3s infinite alternate}
@keyframes wpulse{to{transform:scale(1.25)}}
.down{background:rgba(60,8,18,.85);border:1px solid #ff4d6d;border-radius:10px;padding:6px 10px;text-align:center}.down b{color:#ff4d6d}
.relbar i{display:block;height:100%;background:var(--chloro)}
.tring{width:46px;height:14px;border:2px solid var(--ochre);border-radius:50%;transform:translateY(10px)}
.tring.combat{border-color:var(--danger)}
.duet{background:rgba(20,16,38,.92);border:1px solid var(--bio);border-radius:12px;padding:8px 14px;text-align:center}
.duet .big{font-size:30px;line-height:1.1}
#app.editing #panes,#app.editing .tools,#app.editing #stagebar,#app.editing #accord,#app.editing #divider{display:none!important}
/* editor */
#editor{position:absolute;inset:0;z-index:9;pointer-events:none;font-family:var(--f-body)}
#editor>*{pointer-events:auto}
.ed-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:linear-gradient(rgba(12,9,26,.92),rgba(12,9,26,.6));border-bottom:1px solid var(--line)}
.ed-who{display:flex;align-items:center;gap:8px;font:600 13px var(--f-body)}
.ed-who i{width:12px;height:12px;border-radius:3px}
.ed-who b{font:800 18px var(--f-display);margin-left:6px}
.ed-tabs{display:flex;gap:4px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:3px}
.ed-tabs button{font:700 13px var(--f-body);color:var(--muted);background:none;border:0;border-radius:7px;padding:7px 14px;cursor:pointer}
.ed-tabs button.on{background:var(--ochre);color:#1b1306}
.ed-dna{display:flex;align-items:baseline;gap:6px;font:600 11px var(--f-mono);color:var(--muted)}
.ed-dna b{font:800 22px var(--f-display);color:var(--bio)}
.ed-cx{display:grid;gap:3px;font:600 10px var(--f-mono);color:var(--muted);width:120px}
.ed-cx .bar i{background:var(--violet)}
.ed-btns{margin-left:auto;display:flex;gap:6px}
.ed-btns button{font:700 13px var(--f-body);color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
.ed-btns button.primary{background:var(--ochre);color:#1b1306;border-color:var(--ochre)}
.ed-left{position:absolute;left:0;top:64px;bottom:0;width:270px;background:rgba(14,11,30,.9);border-right:1px solid var(--line);overflow:auto;padding:10px}
.ed-right{position:absolute;right:0;top:64px;bottom:0;width:210px;background:rgba(14,11,30,.86);border-left:1px solid var(--line);overflow:auto;padding:12px}
.ed-right h4,.ed-paint h4{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.ab-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:3px 0}
.ab-row.zero{color:var(--dim)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--raise);border:1px solid var(--line)}
.pips i.on{background:var(--ochre);border-color:var(--ochre)}
.ab-meta{display:flex;justify-content:space-between;font:600 12px var(--f-mono);margin-top:8px;color:var(--muted)}
.ab-meta b{color:var(--text)}
.ed-right .warn{color:#ffb3c0;font-size:12px;line-height:1.4}
.ed-cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ed-cats button{font:700 12px var(--f-body);color:var(--muted);background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 9px;cursor:pointer}
.ed-cats button.on{color:#1b1306;background:var(--bio);border-color:var(--bio)}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed-part{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:grab;display:grid;gap:2px;text-align:center;user-select:none}
.ed-part:hover{border-color:var(--ochre)}
.ed-part img{width:72px;height:72px;margin:0 auto;display:block;pointer-events:none}
.ed-part b{font:700 11.5px var(--f-body)}
.ed-part span{font:600 10.5px var(--f-mono);color:var(--bio)}
.ed-part em{font-style:normal;font-size:10px;color:var(--muted);line-height:1.3}
.ed-part.locked{opacity:.45;cursor:not-allowed}
.ed-part.poor span{color:var(--danger)}
.ed-shape{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:12px}
.ed-shape button,.pats button{font:600 12px var(--f-body);color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px;cursor:pointer;text-transform:capitalize}
.pats{display:flex;flex-wrap:wrap;gap:5px}
.pats button.on{background:var(--ochre);color:#1b1306;border-color:var(--ochre)}
.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:6px}
.sw i{aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:#fff;box-shadow:0 0 0 2px var(--ochre)}
.ed-l{font:600 10px var(--f-mono);color:var(--muted)}
#ed-light{width:100%;accent-color:var(--ochre)}
.ed-paint p{color:var(--muted);font-size:12.5px;line-height:1.45}

    if (G.mode === 2) { const o = this.pl[other(i)], v = project(_kv.set(o.x, o.y + 30, o.z), i); if (v) pane.label(v.x, v.y, `<span style="color:${hueCss(G.players[o.p].hue)}">P${o.p + 1} ship</span>`); }
    this.fx.labels(i);
  },
  beforeRender(i) {
    const q = this.pl[i]; if (!q) return; const pane = Panes[i], e = this.E(i);
    pane.meter('hull', q.hp, this.maxHull(i));
    const cp = this.path(i, q.star || q.path[0] || e.home, this.stars[0]); pane.meter('core', e.tech.core ? 1 : (e.tech.warp - 1) / 3 + (e.rp > 0 ? .05 : 0), 1, e.tech.core ? (cp ? `${cp.length} jumps` : 'route blocked') : `warp ${e.tech.warp}/3 · core drive next`);
    pane.stat('cr', `${fmt(e.credits)} +${this.income(i).toFixed(1)}`); pane.stat('rp', `${fmt(e.rp)} +${this.research(i).toFixed(1)}`); pane.stat('col', this.myColonies(i).length); pane.stat('fl', Math.round(this.fleetDPS(i)) + ' dps');
    const s = q.star, foreign = s && s.owner >= 0 && s.owner !== i;
    pane.acts([{ act: 'up', label: q.target && q.star ? 'Jump' : 'Jump', off: !(q.target && q.star) }, { act: 'a1', label: 'System' }, { act: 'a2', label: 'Diplomacy', off: !foreign && !(q.target && q.target.owner >= 0 && q.target.owner !== i) }, { act: 'a3', label: 'Attack', off: !foreign || !!q.battle }, { act: 'a4', label: 'To the core', off: !e.tech.core }, { act: 'menu', label: 'Empire' }]);
    pane.prompt(q.battle ? `Battle at ${q.battle.star.name}: enemy ${Math.round(q.battle.hp)} · hull ${Math.round(q.hp)}` : q.path.length ? `Travelling · ${q.path.length} jump${q.path.length > 1 ? 's' : ''} left` : q.target ? `Target: ${q.target.name} · ${Math.round(Math.hypot(q.target.x - q.star.x, q.target.z - q.star.z))} ly` : 'No star in range that way. Steer left or right.');
  },
  exit() {},
};
KEYLABEL[0].up = '↑'; KEYLABEL[1].up = 'W';
/* ============================== TITLE, PAUSE, ENDING, LOOP ============================== */
const STAGES = [CellStage, CreatureStage, TribeStage, CivStage, SpaceStage];
function startStage(i) { G.stage = i; setStage(STAGES[i]); }

const TitleStage = {
  enter() {
    const sc = this.scene = new THREE.Scene(); sc.background = new THREE.Color(0x07243f); sc.fog = new THREE.FogExp2(0x0a2e50, .016);
    sc.add(new THREE.HemisphereLight(0xaee8ff, 0x0b1a2e, 1.7)); const d = new THREE.DirectionalLight(0xffffff, 1.4); d.position.set(10, 30, 10); sc.add(d);
    const r = mulberry32(Date.now() & 0xffff); this.cells = [];
    const kinds = ['grazer', 'hunter', 'schooler', 'drifter'], bodies = kinds.map(k => bakeBody(genCell(r, k), { res: .08 }));
    for (let i = 0; i < 22; i++) { const B = bodies[i % 4], cr = new Creature(B, rand(1, 2.8), { shadow: false }); sc.add(cr.group); this.cells.push({ cr, x: rand(-55, 55), z: rand(-35, 35), y: rand(-12, 2), a: rand(0, TAU), sp: rand(1.5, 4) }); }
    const n = 1500, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { p[i * 3] = rand(-90, 90); p[i * 3 + 1] = rand(-20, 20); p[i * 3 + 2] = rand(-60, 60); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); sc.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfe6ff, size: .4, map: dotTexture(), transparent: true, opacity: .6, depthWrite: false })));
    this.t = 0;
  },
  update(dt) { this.t += dt; for (const k of this.cells) { k.a += Math.sin(this.t * .3 + k.x) * dt * .4; k.x += Math.cos(k.a) * k.sp * dt; k.z += Math.sin(k.a) * k.sp * dt; if (Math.abs(k.x) > 65) k.a = Math.PI - k.a; if (Math.abs(k.z) > 42) k.a = -k.a; k.cr.update(dt, k.x, k.z, k.a, () => k.y); } },
  camFor(i, cam) { cam.position.set(Math.sin(this.t * .05) * 8, 36, 28); cam.lookAt(0, -4, 0); },
  exit() { for (const k of this.cells) k.cr.dispose(); },
};
function openTitle() {

  const save = loadSave(), names = [makeName(), makeName()]; let hues = [180, 30], mode = 2;
  const html = () => `<div class="eyebrow">An evolution game · cell to galaxy · one keyboard, two rival species</div>
    <div class="wordmark">Line<em>age</em></div>
    <p>Two species start in the same tide pool. Mould your creature in the editor, befriend or hunt the wildlife, raise a tribe, unite a planet and reach the heart of the galaxy. Every stage leaves a legacy that stays with you. Fight your rival, or sign an accord and prosper together.</p>
    <div class="row" style="margin-top:10px"><div class="seg"><button data-act="mode" data-arg="2" class="${mode === 2 ? 'on' : ''}">Two players · split screen</button><button data-act="mode" data-arg="1" class="${mode === 1 ? 'on' : ''}">One player</button></div></div>
    <div class="players">${[0, 1].slice(0, mode).map(p => `<div class="pcard"><h4><i style="background:${hueCss(hues[p])}"></i>${mode === 2 ? 'Player ' + (p + 1) : 'Your species'}</h4>
      <div class="field"><label for="n${p}">Species name</label><input type="text" id="n${p}" maxlength="14" value="${esc(names[p])}" autocomplete="off"></div>
      <div class="field"><label for="h${p}">Colour</label><input type="range" id="h${p}" min="0" max="350" step="10" value="${hues[p]}"></div>
      <div class="keys">${mode === 2 ? (p === 0 ? '<kbd>Arrows</kbd><span>Move</span><kbd>/ . ; \'</kbd><span>Moves 1 to 4</span><kbd>Enter</kbd><span>Interact, nest, editor</span><kbd>Right Shift</kbd><span>Switch moves, back</span>' : '<kbd>WASD</kbd><span>Move</span><kbd>F G R T</kbd><span>Moves 1 to 4</span><kbd>E</kbd><span>Interact, nest, editor</span><kbd>Q</kbd><span>Switch moves, back</span>') :
      '<kbd>Arrows or WASD</kbd><span>Move</span><kbd>/ . ; \' or F G R T</kbd><span>Moves 1 to 4</span><kbd>Enter or E</kbd><span>Interact, nest, editor</span><kbd>Shift or Q</kbd><span>Switch moves, back</span>'}<kbd>Mouse</kbd><span>The editor</span><kbd>Esc</kbd><span>Pause</span></div></div>`).join('')}</div>
    <p style="font-size:12.5px">Game controllers work too: two controllers play as P1 and P2.</p>
    <div class="row"><button class="btn primary" data-act="new">Begin as single cells</button>${save ? `<button class="btn" data-act="cont">Continue · ${STAGE_NAMES[save.stage] || 'Cell'} stage · ${save.players.map(p => esc(p.name)).join(' vs ')}</button>` : ''}</div>
    <div class="promise"><div><b>Mould anything</b>Drag the spine, fatten it, and snap on mouths, eyes, legs, arms, horns, wings and more. Parts decide your abilities.</div><div><b>A living world</b>Herds, hunters, night stalkers and gentle giants, all built from the same parts, living their own lives.</div><div><b>Dying is fine</b>You always hatch again at your nest and carry on.</div><div><b>Rivals or allies</b>Race your rival, raid them, or sign an accord for Shared Prosperity.</div></div>
    <details><summary>Start at a later stage</summary><div class="row">${STAGE_NAMES.map((n, i) => `<button class="btn" data-act="skip" data-arg="${i}">${i + 1}. ${n}</button>`).join('')}</div><p style="font-size:12px">Skipped stages count as Adaptive legacies with a starter body.</p></details>`;
  const grab = () => { for (let p = 0; p < mode; p++) { const n = $('#n' + p), h = $('#h' + p); if (n) names[p] = (n.value || '').trim().replace(/[^\p{L}\p{N} '\-]/gu, '').slice(0, 14) || makeName(); if (h) hues[p] = +h.value; } };
  const begin = (skip = 0) => {
    grab(); G.mode = mode; G.seed = (Math.random() * 1e9) | 0; G.accord = false; G.accordStages = 0; G.stage = skip;
    G.players = names.slice(0, mode).map((n, p) => newPlayer(p, n, hues[p]));
    for (const P of G.players) { P.cell = starterCell(P); P.dna = 0; if (skip > 0) { P.diet = 'omni'; P.body = starterCreature(P); for (let i = 0; i < skip; i++) addLegacy(P, i, 'mixed'); } }
    Modal.close(); setupPanes(); startStage(skip);
  };
  Modal.open(html(), {
    mode: v => { grab(); mode = +v; Modal.rerender(html()); }, new: () => begin(0), skip: v => begin(+v),
    cont: () => { G.mode = save.mode; G.stage = save.stage; G.accord = save.accord; G.accordStages = save.accordStages || 0; G.seed = save.seed || 1; G.players = save.players; for (const P of G.players) { recalcMods(P); P.unlocked = P.unlocked || []; } Modal.close(); setupPanes(); startStage(G.stage); },
  }, { noPause: true, onOpen: sh => { for (let p = 0; p < 2; p++) { const h = sh.querySelector('#h' + p); if (h) h.addEventListener('input', () => { hues[p] = +h.value; h.closest('.pcard').querySelector('h4 i').style.background = hueCss(hues[p]); }); } } });
}
function onEscape() {
  if (Editor.active) return;
  if (Modal.isOpen) { if (Modal.opts.closable) Modal.close(); return; }
  for (const m of Menus) if (m.isOpen) { m.close(); return; }
  openPause();
}
function openPause() {
  if (!S || S === TitleStage || Editor.active) return;
  const html = () => `<div class="eyebrow">Paused · ${STAGE_NAMES[G.stage]} stage</div><h2>${G.players.map(p => esc(p.name)).join(' vs ')}</h2>
    <p>Progress saves at the start of each stage.</p>
    <div class="results">${G.players.map((P, p) => `<div><div class="eyebrow">${G.mode === 2 ? 'P' + (p + 1) + ' · ' : ''}${esc(P.name)} · lineage</div>${P.legacies.length ? P.legacies.map(legacyCard).join('<div style="height:6px"></div>') : '<p>No legacies yet.</p>'}${modsHTML(P)}</div>`).join('')}</div>
    <div class="row"><button class="btn primary" data-act="resume">Resume <kbd>Esc</kbd></button><button class="btn" data-act="gfx">Graphics: ${Perf.low ? 'Low' : 'High'}</button>${G.mode === 2 ? `<button class="btn" data-act="pad">One controller plays as: P${(Input.padOwner >= 0 ? Input.padOwner : 1) + 1}</button>` : ''}<button class="btn" data-act="restart">Restart this stage</button><button class="btn" data-act="quit">Quit to title</button></div>`;
  Modal.open(html(), {
    resume: () => Modal.close(), restart: () => { Modal.close(); startStage(G.stage); }, quit: () => { Modal.close(); openTitle(); },
    gfx: () => { Perf.manual = true; setQuality(!Perf.low); Modal.rerender(html()); },
    pad: () => { Input.padOwner = (Input.padOwner >= 0 ? Input.padOwner : 1) === 1 ? 0 : 1; Modal.rerender(html()); },
  }, { closable: true });
}
$('#b-menu').addEventListener('click', () => { if (!Modal.isOpen) openPause(); });
$('#b-sound').addEventListener('click', e => { Sfx.init(); Sfx.on = !Sfx.on; e.currentTarget.textContent = Sfx.on ? 'Sound' : 'Muted'; });

function showEnding(kind, winner) {
  const titles = { core: winner >= 0 ? `${G.players[winner].name} reached the galactic core` : 'The galactic core', federation: 'A galaxy united', conquest: winner >= 0 ? `The galaxy belongs to the ${G.players[winner].name}` : 'Conquest', joint: 'Together at the heart of the galaxy' };
  const tone = P => { const a = styleCount(P, 'aggr'), s = styleCount(P, 'social'), m = styleCount(P, 'mixed'); return a > s && a >= m ? 'aggr' : s > a && s >= m ? 'social' : 'mixed'; };
  const epi = P => ({ aggr: `The ${P.name} never forgot the taste of the first hunt. Every step from cell to starship was taken by force.`, social: `The ${P.name} won by being listened to: a grazing cell, a singer, a culture, and finally a voice the galaxy followed.`, mixed: `The ${P.name} were never one thing. They ate what they found, befriended what they could, and fought what they couldn't.` })[tone(P)];
  const shared = G.mode === 2 ? `<p>${G.accordStages ? `The two species spent ${G.accordStages} of 5 stages in accord.` : 'The two species stayed rivals to the very end.'}</p>` : '';
  Modal.open(`<div class="eyebrow">The end${winner >= 0 && G.mode === 2 ? ` · P${winner + 1} wins` : ''}</div><h2>${esc(titles[kind] || 'The end')}</h2>${shared}
    <div class="results">${G.players.map((P, p) => `<div><div class="eyebrow">${G.mode === 2 ? 'P' + (p + 1) + ' · ' : ''}${esc(P.name)} · ${STYLE_WORD[tone(P)]} lineage</div><p>${esc(epi(P))}</p>${P.legacies.map(legacyCard).join('<div style="height:6px"></div>')}${modsHTML(P)}</div>`).join('')}</div>
    <div class="row"><button class="btn primary" data-act="again">Evolve new species</button><button class="btn" data-act="stay">Keep exploring</button></div>`, {
    again: () => { clearSave(); Modal.close(); openTitle(); }, stay: () => Modal.close(),
  });
}

/* ---------- loop ---------- */
let lastT = performance.now(), menuTick = 0, editing = false;
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  try {
    pollPads();
    if (Editor.active !== editing) { editing = Editor.active; $('#app').classList.toggle('editing', editing); if (!editing) resize(); }
    if (Editor.active) { Editor.update(dt); Editor.render(); }
    else if (S) {
      if (!G.paused) { gameClock += dt; S.update(dt); flowTick(dt); }
      if (S.scene) { for (let i = 0; i < Panes.length; i++) if (S.camFor) S.camFor(i, cams[i], G.paused || S._snap > 0 ? 0 : dt);  if (S._snap > 0) S._snap--; render(); for (let i = 0; i < Panes.length; i++) { Panes[i].beginLabels(); if (S.labels) safely(() => S.labels(i)); Panes[i].endLabels(); } }
    }
    perfTick(dt);
    menuTick -= dt; if (menuTick <= 0) { menuTick = .25; for (const m of Menus) m.tick(); }
  } catch (e) { console.error(e); if (!frame.err || now - frame.err > 8000) { frame.err = now; toastAll('Something went wrong, but the game carried on: ' + e.message, 'bad'); } }
  requestAnimationFrame(frame);
}
function boot() {
  if (!window.THREE) { $('#loading').textContent = 'Could not load the 3D engine. Check your connection and reload.'; return; }
  setupPanes(); initRenderer(); $('#loading').hidden = true; openTitle(); requestAnimationFrame(frame);
}
boot();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
